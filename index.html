<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Esteira de Onboarding & Implantação</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
  <!-- Navbar -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-20">
    <div class="max-w-7xl mx-auto px-6 py-4 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="p-2.5 rounded-xl bg-indigo-600/20 border border-indigo-500/30 text-indigo-400">
          <i data-lucide="factory" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold tracking-tight text-white">Esteira de Onboarding & Implantação</h1>
          <p class="text-xs text-slate-400">Linha de produção de clientes • Acompanhamento de estações e SLA</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="resetDemo()" class="text-xs text-slate-400 hover:text-slate-200 px-3 py-2 rounded-lg border border-slate-800 hover:bg-slate-800/60 transition cursor-pointer">
          Restaurar Base
        </button>
        <button onclick="openNewModal()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2 rounded-lg shadow-lg shadow-indigo-600/20 transition cursor-pointer">
          <i data-lucide="plus" class="w-4 h-4"></i>
          Novo Cliente na Esteira
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8 space-y-8">
    <!-- KPIs -->
    <section id="kpis" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></section>

    <!-- Lista de Esteiras -->
    <section class="space-y-4">
      <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
        <i data-lucide="sparkles" class="w-4 h-4 text-indigo-400"></i>
        Linha de Montagem Ativa (Clique em um cliente para abrir checklist e histórico)
      </h2>
      <div id="tracks-container" class="space-y-5"></div>
    </section>
  </main>

  <!-- Gaveta Lateral -->
  <div id="drawer-backdrop" class="hidden fixed inset-0 bg-black/60 backdrop-blur-xs z-40 flex justify-end" onclick="closeDrawer()">
    <div id="drawer-content" class="w-full max-w-lg bg-slate-900 border-l border-slate-800 h-full overflow-y-auto p-6 space-y-6 shadow-2xl" onclick="event.stopPropagation()"></div>
  </div>

  <!-- Modal Novo Cliente -->
  <div id="new-modal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-xs z-50 flex items-center justify-center p-4">
    <form onsubmit="addClient(event)" class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold text-white">Adicionar Cliente na Esteira</h3>
        <button type="button" onclick="closeNewModal()" class="text-slate-400 hover:text-white cursor-pointer">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <div>
        <label class="text-xs text-slate-400 block mb-1">Nome do Veículo / Empresa *</label>
        <input id="new-name" type="text" required placeholder="Ex: Ativa" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" />
      </div>
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs text-slate-400 block mb-1">Responsável Comercial</label>
          <input id="new-resp" type="text" value="Nicolly" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Meta de Go-Live</label>
          <input id="new-golive" type="text" placeholder="Ex: 30/11/2026" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" />
        </div>
      </div>
      <div class="pt-2 flex justify-end gap-2">
        <button type="button" onclick="closeNewModal()" class="px-4 py-2 rounded-lg text-xs text-slate-300 hover:bg-slate-800 cursor-pointer">Cancelar</button>
        <button type="submit" class="px-4 py-2 rounded-lg text-xs font-medium bg-indigo-600 hover:bg-indigo-500 text-white cursor-pointer">Iniciar na Estação 1</button>
      </div>
    </form>
  </div>

  <script>
    const STAGES = [
      { id: 0, title: "1. Handoff", subtitle: "Comercial → Implantação", slaDays: 2 },
      { id: 1, title: "2. Kickoff", subtitle: "Alinhamento inicial", slaDays: 3 },
      { id: 2, title: "3. Coleta", subtitle: "Acessos e dados", slaDays: 5 },
      { id: 3, title: "4. Setup", subtitle: "Configuração técnica", slaDays: 5 },
      { id: 4, title: "5. Treinamento", subtitle: "Homologação", slaDays: 4 },
      { id: 5, title: "6. Go-Live", subtitle: "Produção e Suporte", slaDays: 2 },
    ];

    const DEFAULT_CHECKLISTS = {
      0: ["Validar escopo contratado", "Criar cadastro interno", "Definir responsável técnico"],
      1: ["Enviar boas-vindas", "Realizar reunião de Kickoff", "Acordar cronograma macro"],
      2: ["Receber credenciais/acessos", "Receber base de dados/arquivos", "Validar integridade dos insumos"],
      3: ["Configurar ambiente e permissões", "Importar dados e regras", "Executar checklist de QA interno"],
      4: ["Treinar usuários-chave", "Acompanhar testes assistidos", "Colher aceite de homologação"],
      5: ["Virar chave para produção", "Acompanhar primeiros dias", "Transferir histórico para o Suporte"],
    };

    const STATUS_CONFIG = {
      em_dia: { label: "Em dia", badge: "bg-emerald-500/15 text-emerald-300 border-emerald-500/30", dot: "bg-emerald-400", border: "border-emerald-500/40" },
      aguardando_cliente: { label: "Aguardando cliente", badge: "bg-amber-500/15 text-amber-300 border-amber-500/30", dot: "bg-amber-400", border: "border-amber-500/40" },
      travado: { label: "Travado / Atenção", badge: "bg-rose-500/15 text-rose-300 border-rose-500/30", dot: "bg-rose-400", border: "border-rose-500/40" },
    };

    function createChecklists() {
      const obj = {};
      Object.entries(DEFAULT_CHECKLISTS).forEach(([k, arr]) => {
        obj[k] = arr.map((text, i) => ({ id: `${k}-${i}`, text, done: false }));
      });
      return obj;
    }

    const INITIAL_CLIENTS = [
      {
        id: "2",
        name: "Ativa (Mais Canal Mídias)",
        responsible: "Angélica Machado",
        currentStage: 4,
        status: "em_dia",
        daysInStage: 2,
        goLiveTarget: "30/11/2026",
        blockerReason: "",
        checklists: createChecklists(),
        logs: [{ date: "01/11/2026", event: "Entrada na esteira (Inventário Set/26)" }]
      },
      {
        id: "4",
        name: "BR Outdoor (Blue Media)",
        responsible: "Kim Soave",
        currentStage: 3,
        status: "em_dia",
        daysInStage: 3,
        goLiveTarget: "05/12/2026",
        blockerReason: "",
        checklists: createChecklists(),
        logs: [{ date: "02/11/2026", event: "Iniciado setup técnico" }]
      },
      {
        id: "5",
        name: "Divulcart (MSC Propaganda)",
        responsible: "Rildo Gomes",
        currentStage: 2,
        status: "em_dia",
        daysInStage: 1,
        goLiveTarget: "10/12/2026",
        blockerReason: "",
        checklists: createChecklists(),
        logs: [{ date: "04/11/2026", event: "Aguardando envio de insumos" }]
      },
      {
        id: "6",
        name: "Even OOH (Even Marketing)",
        responsible: "Vinícius Vicentin",
        currentStage: 3,
        status: "em_dia",
        daysInStage: 2,
        goLiveTarget: "02/12/2026",
        blockerReason: "",
        checklists: createChecklists(),
        logs: [{ date: "03/11/2026", event: "Carga Out/26 em andamento" }]
      },
      {
        id: "8",
        name: "Interplan Mídia",
        responsible: "Alexander Rodrigues",
        currentStage: 4,
        status: "em_dia",
        daysInStage: 1,
        goLiveTarget: "28/11/2026",
        blockerReason: "",
        checklists: createChecklists(),
        logs: [{ date: "05/11/2026", event: "Treinamento agendado" }]
      },
      {
        id: "9",
        name: "J.Silva OOH (J.Silva Painéis)",
        responsible: "Nádia Cristina",
        currentStage: 1,
        status: "aguardando_cliente",
        daysInStage: 5,
        goLiveTarget: "15/12/2026",
        blockerReason: "Aguardando validação de escopo comercial (Em Curso).",
        checklists: createChecklists(),
        logs: [{ date: "06/11/2026", event: "Kickoff iniciado - Em Curso" }]
      },
      {
        id: "11",
        name: "LigaDOOH (DOOH Marketingplace)",
        responsible: "Ana Luiza Holtermann",
        currentStage: 5,
        status: "em_dia",
        daysInStage: 1,
        goLiveTarget: "20/11/2026",
        blockerReason: "",
        checklists: createChecklists(),
        logs: [{ date: "07/11/2026", event: "Virada Go-Live realizada" }]
      },
      {
        id: "13",
        name: "Nova OOH",
        responsible: "Rafael Seiler",
        currentStage: 2,
        status: "em_dia",
        daysInStage: 2,
        goLiveTarget: "08/12/2026",
        blockerReason: "",
        checklists: createChecklists(),
        logs: [{ date: "08/11/2026", event: "Fase de Coleta" }]
      },
      {
        id: "14",
        name: "Out Midia Publicidade",
        responsible: "Igor Lazaroni",
        currentStage: 3,
        status: "em_dia",
        daysInStage: 2,
        goLiveTarget: "04/12/2026",
        blockerReason: "",
        checklists: createChecklists(),
        logs: [{ date: "09/11/2026", event: "Setup em andamento" }]
      },
      {
        id: "18",
        name: "Publicar Mídia Exterior",
        responsible: "Giovani Gaio",
        currentStage: 4,
        status: "em_dia",
        daysInStage: 1,
        goLiveTarget: "01/12/2026",
        blockerReason: "",
        checklists: createChecklists(),
        logs: [{ date: "10/11/2026", event: "Homologação e Treinamento" }]
      },
      {
        id: "21",
        name: "Ultramídia Painéis",
        responsible: "William Santoro",
        currentStage: 5,
        status: "em_dia",
        daysInStage: 1,
        goLiveTarget: "18/11/2026",
        blockerReason: "",
        checklists: createChecklists(),
        logs: [{ date: "11/11/2026", event: "Operação assistida / Go-Live" }]
      },
      {
        id: "22",
        name: "Vê Mais (Junkes & Borba)",
        responsible: "Tathiane Schmitz",
        currentStage: 3,
        status: "em_dia",
        daysInStage: 2,
        goLiveTarget: "03/12/2026",
        blockerReason: "",
        checklists: createChecklists(),
        logs: [{ date: "12/11/2026", event: "Configuração de inventário" }]
      }
    ];

    let clients = JSON.parse(localStorage.getItem("client_onboarding_html_v2")) || INITIAL_CLIENTS;
    let selectedClientId = null;

    function save() {
      localStorage.setItem("client_onboarding_html_v2", JSON.stringify(clients));
      render();
    }

    function render() {
      const total = clients.length;
      const blocked = clients.filter(c => c.status !== "em_dia").length;
      const avg = total ? (clients.reduce((a, c) => a + c.daysInStage, 0) / total).toFixed(1) : "0";
      const counts = STAGES.map(s => ({ title: s.title, count: clients.filter(c => c.currentStage === s.id).length }));
      const top = counts.reduce((p, c) => (c.count > p.count ? c : p), { title: "-", count: 0 });

      document.getElementById("kpis").innerHTML = `
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
          <p class="text-xs uppercase tracking-wider text-slate-400">Clientes na Esteira</p>
          <p class="text-2xl font-bold text-white mt-1">${total}</p>
          <p class="text-xs text-slate-500 mt-1">Em fluxo ativo de implantação</p>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
          <p class="text-xs uppercase tracking-wider text-slate-400">Com Pendência / Travados</p>
          <p class="text-2xl font-bold text-amber-400 mt-1">${blocked}</p>
          <p class="text-xs text-slate-500 mt-1">Aguardando cliente ou bloqueio</p>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
          <p class="text-xs uppercase tracking-wider text-slate-400">Tempo Médio na Estação</p>
          <p class="text-2xl font-bold text-indigo-400 mt-1">${avg} dias</p>
          <p class="text-xs text-slate-500 mt-1">Aging atual da etapa ativa</p>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
          <p class="text-xs uppercase tracking-wider text-slate-400">Maior Concentração</p>
          <p class="text-lg font-bold text-emerald-400 mt-1 truncate">${top.count > 0 ? `${top.title} (${top.count})` : "Nenhum"}</p>
          <p class="text-xs text-slate-500 mt-1">Estação com mais clientes</p>
        </div>
      `;

      document.getElementById("tracks-container").innerHTML = clients.map(client => {
        const st = STATUS_CONFIG[client.status];
        const stageMeta = STAGES[client.currentStage];
        const overSla = client.daysInStage > stageMeta.slaDays;
        const list = client.checklists[client.currentStage] || [];
        const doneCount = list.filter(i => i.done).length;
        const progressWidth = ((client.currentStage + 0.5) / STAGES.length) * 100;

        return `
          <div onclick="openDrawer('${client.id}')" class="bg-slate-900/90 hover:bg-slate-900 border ${st.border} rounded-2xl p-5 transition cursor-pointer shadow-md">
            <div class="flex flex-wrap items-center justify-between gap-4 pb-4 border-b border-slate-800/80">
              <div class="flex items-center gap-3">
                <span class="w-3 h-3 rounded-full ${st.dot} animate-pulse"></span>
                <div>
                  <h3 class="text-base font-bold text-white">${client.name}</h3>
                  <div class="flex flex-wrap items-center gap-3 text-xs text-slate-400 mt-0.5">
                    <span>Resp. Com.: ${client.responsible}</span>
                    <span>•</span>
                    <span>Meta Go-Live: <strong class="text-slate-200">${client.goLiveTarget}</strong></span>
                  </div>
                </div>
              </div>
              <div class="flex items-center gap-3">
                <span class="text-xs px-2.5 py-1 rounded-full border font-medium ${overSla ? "bg-rose-500/15 text-rose-300 border-rose-500/30" : "bg-slate-800 text-slate-300 border-slate-700"}">
                  ${client.daysInStage}d na estação (SLA: ${stageMeta.slaDays}d)
                </span>
                <span class="text-xs px-3 py-1 rounded-full border font-medium ${st.badge}">${st.label}</span>
              </div>
            </div>

            <div class="pt-5 pb-2 overflow-x-auto">
              <div class="min-w-[760px] relative">
                <div class="h-2.5 bg-slate-800 rounded-full w-full absolute top-5 left-0 overflow-hidden border border-slate-700/70">
                  <div class="h-full bg-gradient-to-r from-emerald-500 via-indigo-500 to-indigo-400 transition-all duration-500" style="width: ${progressWidth}%"></div>
                </div>
                <div class="grid grid-cols-6 gap-2 relative z-10">
                  ${STAGES.map((stage, idx) => {
                    const isCompleted = idx < client.currentStage;
                    const isCurrent = idx === client.currentStage;
                    const boxClass = isCompleted
                      ? "bg-emerald-600 border-emerald-400 text-white"
                      : isCurrent
                      ? "bg-indigo-600 border-indigo-300 text-white scale-110 ring-4 ring-indigo-500/25"
                      : "bg-slate-900 border-slate-700 text-slate-500";
                    const titleClass = isCurrent ? "text-indigo-300" : isCompleted ? "text-emerald-400" : "text-slate-500";
                    return `
                      <div class="flex flex-col items-center text-center">
                        <div class="w-11 h-11 rounded-xl flex items-center justify-center border-2 transition-all shadow-md ${boxClass}">
                          ${isCompleted ? '<i data-lucide="check-circle-2" class="w-5 h-5"></i>' : isCurrent ? '<i data-lucide="factory" class="w-5 h-5"></i>' : `<span class="text-xs font-bold">${idx + 1}</span>`}
                        </div>
                        <p class="text-xs font-semibold mt-2.5 ${titleClass}">${stage.title}</p>
                        <p class="text-[11px] text-slate-500">${stage.subtitle}</p>
                        ${isCurrent ? `<span class="mt-1.5 text-[10px] bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full">Checklist: ${doneCount}/${list.length}</span>` : ""}
                      </div>
                    `;
                  }).join("")}
                </div>
              </div>
            </div>

            <div class="mt-4 pt-3 border-t border-slate-800/70 flex flex-wrap items-center justify-between gap-3" onclick="event.stopPropagation()">
              <div class="text-xs text-slate-400">
                ${client.blockerReason ? `<span class="text-amber-300"><strong>Motivo:</strong> ${client.blockerReason}</span>` : "Fluxo operando normalmente na estação atual."}
              </div>
              <div class="flex items-center gap-2">
                <button ${client.currentStage === 0 ? "disabled" : ""} onclick="moveStage('${client.id}', -1)" class="text-xs px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 disabled:opacity-30 text-slate-200 transition cursor-pointer">← Voltar</button>
                <button ${client.currentStage === STAGES.length - 1 ? "disabled" : ""} onclick="moveStage('${client.id}', 1)" class="text-xs px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 disabled:opacity-30 text-white font-medium transition cursor-pointer">Avançar Estação →</button>
              </div>
            </div>
          </div>
        `;
      }).join("");

      if (selectedClientId) renderDrawer();
      lucide.createIcons();
    }

    function moveStage(id, dir) {
      const today = new Date().toLocaleDateString("pt-BR");
      clients = clients.map(c => {
        if (c.id !== id) return c;
        const next = Math.min(Math.max(c.currentStage + dir, 0), STAGES.length - 1);
        if (next === c.currentStage) return c;
        return {
          ...c,
          currentStage: next,
          daysInStage: 0,
          status: "em_dia",
          blockerReason: "",
          logs: [{ date: today, event: `${dir === 1 ? "Avançou" : "Retornou"} para ${STAGES[next].title}` }, ...c.logs],
        };
      });
      save();
    }

    function openDrawer(id) {
      selectedClientId = id;
      document.getElementById("drawer-backdrop").classList.remove("hidden");
      renderDrawer();
      lucide.createIcons();
    }

    function closeDrawer() {
      selectedClientId = null;
      document.getElementById("drawer-backdrop").classList.add("hidden");
    }

    function renderDrawer() {
      const c = clients.find(x => x.id === selectedClientId);
      if (!c) return;
      const list = c.checklists[c.currentStage] || [];
      document.getElementById("drawer-content").innerHTML = `
        <div class="flex items-start justify-between gap-4 border-b border-slate-800 pb-4">
          <div>
            <span class="text-xs uppercase tracking-wider text-indigo-400 font-semibold">Estação Atual: ${STAGES[c.currentStage].title}</span>
            <h2 class="text-xl font-bold text-white mt-0.5">${c.name}</h2>
            <p class="text-xs text-slate-400 mt-1">Responsável Comercial: ${c.responsible} • Meta Go-Live: ${c.goLiveTarget}</p>
          </div>
          <button onclick="closeDrawer()" class="p-2 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 cursor-pointer">✕</button>
        </div>

        <div class="space-y-3">
          <label class="text-xs font-semibold uppercase tracking-wider text-slate-400">Status na Estação</label>
          <div class="grid grid-cols-3 gap-2">
            ${Object.entries(STATUS_CONFIG).map(([key, cfg]) => `
              <button onclick="updateStatus('${c.id}', '${key}')" class="text-xs py-2 px-2 rounded-lg border font-medium transition cursor-pointer ${c.status === key ? cfg.badge : "bg-slate-800/60 border-slate-700 text-slate-400 hover:text-slate-200"}">
                ${cfg.label}
              </button>
            `).join("")}
          </div>
          ${c.status !== "em_dia" ? `
            <div>
              <label class="text-xs text-slate-400 block mb-1">Motivo da pendência / bloqueio:</label>
              <input type="text" value="${c.blockerReason || ""}" onchange="updateReason('${c.id}', this.value)" placeholder="Descreva o motivo..." class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" />
            </div>
          ` : ""}
        </div>

        <div class="space-y-3">
          <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Checklist — ${STAGES[c.currentStage].title}</h3>
          <div class="space-y-2">
            ${list.map(item => `
              <button onclick="toggleCheck('${c.id}', ${c.currentStage}, '${item.id}')" class="w-full flex items-center gap-3 p-3 rounded-xl bg-slate-950/70 border border-slate-800 hover:border-slate-700 text-left transition cursor-pointer">
                <span class="text-sm ${item.done ? "text-emerald-400" : "text-slate-500"}">${item.done ? "☑" : "☐"}</span>
                <span class="text-sm ${item.done ? "line-through text-slate-500" : "text-slate-200"}">${item.text}</span>
              </button>
            `).join("")}
          </div>
        </div>

        <div class="space-y-3">
          <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Histórico de Rastreio</h3>
          <div class="border-l-2 border-slate-800 ml-2 pl-4 space-y-3">
            ${c.logs.map(l => `
              <div class="relative">
                <span class="w-2.5 h-2.5 rounded-full bg-indigo-500 absolute -left-[21px] top-1.5"></span>
                <p class="text-xs text-slate-400">${l.date}</p>
                <p class="text-sm text-slate-200">${l.event}</p>
              </div>
            `).join("")}
          </div>
        </div>

        <div class="pt-4 border-t border-slate-800 flex justify-between items-center">
          <button onclick="deleteClient('${c.id}')" class="text-xs text-rose-400 hover:text-rose-300 cursor-pointer">Remover cliente</button>
          <button onclick="closeDrawer()" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-medium px-4 py-2 rounded-lg cursor-pointer">Fechar</button>
        </div>
      `;
    }

    function updateStatus(id, status) {
      clients = clients.map(c => c.id === id ? { ...c, status } : c);
      save();
    }

    function updateReason(id, blockerReason) {
      clients = clients.map(c => c.id === id ? { ...c, blockerReason } : c);
      save();
    }

    function toggleCheck(id, stage, itemId) {
      clients = clients.map(c => {
        if (c.id !== id) return c;
        const updated = c.checklists[stage].map(i => i.id === itemId ? { ...i, done: !i.done } : i);
        return { ...c, checklists: { ...c.checklists, [stage]: updated } };
      });
      save();
    }

    function deleteClient(id) {
      clients = clients.filter(c => c.id !== id);
      closeDrawer();
      save();
    }

    function openNewModal() { document.getElementById("new-modal").classList.remove("hidden"); }
    function closeNewModal() { document.getElementById("new-modal").classList.add("hidden"); }

    function addClient(e) {
      e.preventDefault();
      const name = document.getElementById("new-name").value.trim();
      if (!name) return;
      const today = new Date().toLocaleDateString("pt-BR");
      clients.unshift({
        id: Date.now().toString(),
        name,
        responsible: document.getElementById("new-resp").value.trim() || "Equipe",
        currentStage: 0,
        status: "em_dia",
        daysInStage: 0,
        goLiveTarget: document.getElementById("new-golive").value.trim() || "A definir",
        blockerReason: "",
        checklists: createChecklists(),
        logs: [{ date: today, event: "Entrada na esteira (Handoff)" }],
      });
      document.getElementById("new-name").value = "";
      document.getElementById("new-golive").value = "";
      closeNewModal();
      save();
    }

    function resetDemo() {
      localStorage.removeItem("client_onboarding_html_v2");
      clients = JSON.parse(JSON.stringify(INITIAL_CLIENTS));
      closeDrawer();
      render();
    }

    render();
  </script>
</body>
</html>
